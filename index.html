<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Qindica</title>
    <meta name="description" content="Rede social de indicações baseada em confiança onde usuários recomendam pessoas." />
    <meta property="og:title" content="Qindica" />
    <meta property="og:description" content="Rede social de indicações baseada em confiança onde usuários recomendam pessoas." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400..900;1,6..12,400..900&family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Qindica" />
    <meta name="application-name" content="Qindica" />
    <meta name="theme-color" content="#7B2FFF" />

    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F4F4F6;
        color: #171717;
        font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 99999;
      }
      .dark #initial-splash {
        background-color: #0E0E11;
        color: #F5F5F5;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes splash-progress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(30%); }
        100% { transform: translateX(150%); }
      }
      .splash-logo-box {
        animation: splash-pulse 2s ease-in-out infinite;
      }
      .splash-bar-inner {
        animation: splash-progress 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('qindica_theme_mode');
          var isDark = mode === 'dark' || (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F4F6] dark:bg-[#0E0E11] text-neutral-900 dark:text-neutral-100 font-sans antialiased select-none transition-colors duration-200">
    <div id="root">
      <div id="initial-splash">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 320px; padding: 24px;">
          <!-- Qindica Logo Badge -->
          <div class="splash-logo-box" style="width: 68px; height: 68px; border-radius: 14px; background: linear-gradient(135deg, #8B42FF 0%, #6716EE 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px -6px rgba(123, 47, 255, 0.4); margin-bottom: 18px;">
            <svg viewBox="0 0 200 200" width="52" height="52" fill="none">
              <g transform="translate(100, 100) scale(0.70) translate(-96, -93)">
                <path d="M 68 36 C 33 36 10 59 10 94 C 10 129 33 152 68 152 C 78.5 152 88.5 149.2 97.2 144.1 L 115.8 162.7 C 119.2 166.1 124.8 166.1 128.2 162.7 C 131.6 159.3 131.6 153.7 128.2 150.3 L 110.1 132.2 C 118.9 122.3 124 109 124 94 C 124 59 101 36 68 36 Z M 68 60 C 86.8 60 99 74.5 99 94 C 99 105.2 93.8 115 85.4 120.6 L 79.2 114.4 C 75.8 111 70.2 111 66.8 114.4 C 63.4 117.8 63.4 123.4 66.8 126.8 L 71.2 131.2 C 70.1 131.7 69.1 132 68 132 C 49.2 132 35 113.2 35 94 C 35 74.8 49.2 60 68 60 Z" fill="#FFFFFF" />
                <rect x="144" y="90" width="22" height="62" rx="11" fill="#FFFFFF" />
                <path d="M 155 24 C 156.2 24 157.3 24.8 157.7 26 L 163.5 41.5 L 179.8 42.6 C 181.1 42.7 182.2 43.7 182.5 45 C 182.9 46.3 182.4 47.6 181.3 48.4 L 168.7 58.2 L 172.9 74.2 C 173.2 75.5 172.7 76.8 171.6 77.6 C 170.5 78.4 169.1 78.4 168 77.5 L 155 68.3 L 142 77.5 C 140.9 78.4 139.5 78.4 138.4 77.6 C 137.3 76.8 136.8 75.5 137.1 74.2 L 141.3 58.2 L 128.7 48.4 C 127.6 47.6 127.1 46.3 127.5 45 C 127.8 43.7 128.9 42.7 130.2 42.6 L 146.5 41.5 L 152.3 26 C 152.7 24.8 153.8 24 155 24 Z" fill="#FFA800" stroke="#FFA800" stroke-width="4" stroke-linejoin="round" />
              </g>
            </svg>
          </div>
          
          <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1;">Qindica</h1>
          <p style="margin: 6px 0 24px 0; font-size: 13px; font-weight: 500; opacity: 0.65; line-height: 1.4;">Rede de indicações de confiança</p>
          
          <!-- Indeterminate Progress Indicator -->
          <div style="width: 130px; height: 3px; border-radius: 999px; background-color: rgba(123, 47, 255, 0.15); overflow: hidden; position: relative;">
            <div class="splash-bar-inner" style="position: absolute; top: 0; left: 0; bottom: 0; width: 60%; background: linear-gradient(90deg, #7B2FFF, #A36BFF); border-radius: 999px;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
